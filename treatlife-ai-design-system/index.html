<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Treat Life | Premium Human Grade Dog Treats</title>
  <meta name="description" content="">
  <meta property="og:image" content="" data-brand-social-preview>
  <link rel="icon" href="" data-brand-favicon>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body id="top" data-site-root>
  <div class="announcement-bar text-center" data-copy-announcement></div>

  <header class="site-nav">
    <div class="container">
      <a class="tl-logo" href="#top">
        <span class="tl-shield" aria-hidden="true">●</span>
        <span data-brand-name></span>
      </a>

      <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="mainNav" aria-label="Toggle navigation">
        ☰
      </button>

      <div class="nav-menu" id="mainNav" data-nav-menu>
        <ul class="nav-links" data-mount-nav-links></ul>
        <a href="#drop" class="btn btn-outline-gold" data-copy-nav-cta></a>
      </div>
    </div>
  </header>

  <main>
    <section class="hero-section">
      <div class="container">
        <div class="hero-grid">
          <div>
            <p class="eyebrow" data-copy-hero-eyebrow></p>
            <h1 class="hero-title" data-brand-tagline></h1>
            <div class="hero-rule" aria-hidden="true">
              <span></span>
              <span class="rule-mark">●</span>
              <span></span>
            </div>
            <p class="hero-copy" data-copy-hero-subheadline></p>
            <div class="hero-actions">
              <a href="#treats" class="btn btn-gold btn-lg" data-copy-hero-primary></a>
              <a href="#brand" class="btn btn-ghost btn-lg" data-copy-hero-secondary></a>
            </div>
          </div>
          <div class="hero-image-card">
            <img src="" alt="" data-copy-hero-image>
          </div>
        </div>
      </div>
    </section>

    <section id="ingredients" class="value-strip">
      <div class="container">
        <div class="value-grid" data-mount-proof-strip></div>
      </div>
    </section>

    <section id="treats" class="product-section section-pad">
      <div class="container">
        <div class="section-header text-center">
          <p class="eyebrow" data-copy-products-eyebrow></p>
          <h2 data-copy-products-headline></h2>
          <p data-copy-products-intro></p>
        </div>

        <div class="product-grid" data-mount-product-grid></div>
      </div>
    </section>

    <section id="brand" class="story-section section-pad">
      <div class="container">
        <div class="story-grid">
          <div>
            <p class="eyebrow" data-copy-about-eyebrow></p>
            <h2 data-copy-about-headline></h2>
            <div data-mount-about-body></div>
          </div>
          <div class="brand-image-card">
            <img src="" alt="" data-copy-about-image>
          </div>
        </div>
      </div>
    </section>

    <section class="copy-system section-pad">
      <div class="container">
        <div class="copy-grid" data-mount-copy-system></div>
      </div>
    </section>

    <section id="drop" class="drop-section">
      <div class="container">
        <div class="drop-panel text-center">
          <p class="eyebrow" data-copy-cta-eyebrow></p>
          <h2 data-copy-cta-headline></h2>
          <p data-copy-cta-body></p>
          <form class="drop-form" id="dropForm">
            <label class="sr-only" for="email" data-copy-cta-input-label></label>
            <input id="email" type="email" class="form-control" placeholder="" required data-copy-cta-input>
            <button class="btn btn-gold btn-lg" type="submit" data-copy-cta-button></button>
          </form>
          <p class="drop-success" id="dropSuccess" role="status" hidden data-copy-cta-success></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-grid">
        <div>
          <div class="tl-logo footer-logo" data-brand-name></div>
          <p data-brand-tagline></p>
        </div>
        <div class="footer-links" data-mount-footer-links></div>
      </div>
      <p class="footer-note" data-copy-footer-disclaimer></p>
    </div>
  </footer>

  <script src="config/images.js"></script>
  <script src="config/products.js"></script>
  <script src="config/copy.js"></script>
  <script src="config/brand.concepts.js"></script>
  <script src="config/index.js"></script>
  <script src="js/components.js"></script>
  <script src="js/render.js"></script>
  <script src="main.js"></script>
</body>
</html>
